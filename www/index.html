<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1,.num{font-family:"Barlow Semi Condensed",system-ui,sans-serif;font-weight:700;margin:0}
h1{font-size:28px;letter-spacing:.2px}
.sub,.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.score{font-size:64px;line-height:1;margin:6px 0}
.tgt{margin-top:6px;font-weight:600;color:var(--ball)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:14px 0;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);width:100%;margin-top:14px}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.pad.f{grid-template-columns:repeat(4,1fr)}.pad.t{grid-template-columns:repeat(3,1fr)}
.pad .r4,.pad .r6{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.pad .wk{background:var(--ball);color:#fff;border-color:var(--ball)}
.pad .on{outline:3px solid var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:500;text-align:right;padding:4px 0}th:first-child,td:first-child{text-align:left}
td{padding:6px 0;text-align:right;border-top:1px solid var(--bd)}
td .s{font-size:12px;color:var(--mut)}
.beads{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.bead{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--soft);padding:0 4px}
.bead.b{background:var(--ac);color:var(--acx)}.bead.w{background:var(--ball);color:#fff}.bead.e{border:1px dashed var(--mut);background:none}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:10px 0}.tabs .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}

.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75%;overflow:auto}
.sheet button{display:block;width:100%;margin:6px 0;text-align:left;padding:13px}
.hist{padding:8px 0;border-top:1px solid var(--bd)}
.wrap{overflow-x:auto}
</style></head>

function loginV(){return '<div style="text-align:center;margin-top:60px"><h1 style="font-size:42px">PitchLog</h1><div class="sub">Live cricket scoring. No ads.</div><button class="pri" style="margin-top:28px" onclick="signIn()">Sign in with Google</button>'+(authErr?'<div class="tgt" style="font-size:14px;word-break:break-word">'+esc(authErr)+'</div>':'')+'<div class="muted" style="margin-top:16px">Sign in to score matches or follow them live.</div></div>'}
function liveList(){var h='<div class="card"><b>Live and recent matches</b>';if(!ML.length)h+='<div class="muted" style="margin-top:6px">No matches yet. Start one below.</div>';ML.forEach(function(m){h+='<div class="hist" onclick="watch(\''+m.id+'\')" style="cursor:pointer"><div><span style="font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;background:'+(m.live?'var(--ball)':'var(--mut)')+'">'+(m.live?'LIVE':'ENDED')+'</span> <b>'+esc(m.title||'')+'</b></div><div>'+esc(m.summary||'')+'</div><div class="muted">'+esc(m.result||'')+' \u00b7 scored by '+esc(m.ownerName||'')+'</div></div>'});return h+'</div>'}
function fo(b){return Math.floor(b/6)+'.'+b%6}
function nb(){return{r:0,b:0,f:0,s:0,out:''}}
function inn(b){return{bat:b,r:0,w:0,b:0,x:0,B:{},O:{},st:null,ns:null,bw:null,lb:null,ov:[]}}
function cur(){return S.i[S.c]}

  function g(id){return $('#'+id).value.trim()}
  function mk(n,d,l){var p=l?l.split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean):[];var t={n:n||d,p:p};var k=1;if(!p.length){while(t.p.length<11)t.p.push(t.n+' '+(k++))}while(t.p.length<2)t.p.push(t.n+' '+(t.p.length+1));return t}

}

function fld(i){var I=cur();ball('w',0,dis,dis==='Run out'?roWho:null,S.t[1-I.bat].p[i])}function setBat(i){var I=cur(),n=S.t[I.bat].p[i];I.B[n]=nb();if(!I.st)I.st=n;else I.ns=n;save();render()}function setB(i){var I=cur(),n=S.t[1-I.bat].p[i];I.bw=n;if(!I.O[n])I.O[n]={b:0,r:0,w:0};save();render()}

function ball(k,n,how,who,fld){

function endInn(){

  if(S.mom)tx+=String.fromCharCode(10)+'Man of the Match: '+S.mom;if(navigator.share){navigator.share({text:tx}).catch(function(){})}else{try{navigator.clipboard.writeText(tx);alert('Result copied')}catch(e){}}
}
function roles(){var h='<h1>Captain and wicketkeeper</h1><div class="sub">Choose for each team before the match starts.</div>';S.t.forEach(function(t,ti){function sel(id,c){return '<select id="'+id+'">'+t.p.map(function(n,i){return '<option value="'+i+'"'+(n===c?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'}h+='<div class="card"><b>'+esc(t.n)+'</b><label>Captain</label>'+sel('cp'+ti,t.cap)+'<label>Wicketkeeper</label>'+sel('wk'+ti,t.wk)+'</div>'});return h+'<button class="pri" onclick="begin()">Begin match</button><button style="width:100%;margin-top:8px" onclick="S=null;save();render()">Back</button>'}
function begin(){S.t.forEach(function(t,ti){t.cap=t.p[+$('#cp'+ti).value];t.wk=t.p[+$('#wk'+ti).value]});S.pre=false;S.id=USER.uid.slice(0,8)+Date.now().toString(36);S.owner=USER.uid;S.i.push(inn(S.first));save();render()}
function tg(ti,n){var t=S.t[ti],a=[];if(t.cap===n)a.push('c');if(t.wk===n)a.push('wk');return a.length?' ('+a.join(', ')+')':''}
function dism(w){var I=cur(),k=S.t[1-I.bat].wk;if(w==='Stumped'&&k){ball('w',0,'Stumped',null,k)}else{dis=w;pend='fld';render()}}
function home(){
  var h='<h1>PitchLog</h1><div class="sub">Signed in as '+esc(USER.displayName||USER.email||'')+' \u00b7 <a href="#" onclick="signOut();return false" style="color:var(--ac)">Sign out</a></div>'+(syncErr?'<div class="tgt" style="font-size:13px;word-break:break-word">'+esc(syncErr)+'</div>':'')+liveList()+'<div class="card"><label>Team 1</label><input id="n1" placeholder="Team A"><label>Team 1 players (comma separated, optional)</label><textarea id="p1" placeholder="Leave blank for 11 numbered players"></textarea><label>Team 2</label><input id="n2" placeholder="Team B"><label>Team 2 players (comma separated, optional)</label><textarea id="p2"></textarea><label>Overs per innings</label><input id="ov" type="number" inputmode="numeric" value="20" min="1" max="90"><label>Batting first</label><select id="bf"><option value="0">Team 1</option><option value="1">Team 2</option></select><button class="pri" onclick="start()">Start match</button></div>';

function scoreV(){
  var I=cur(),h='<div class="card"><div class="muted">'+esc(S.t[I.bat].n)+' batting · innings '+(S.c+1)+' of 2</div><div class="num score">'+I.r+'/'+I.w+'</div><div class="muted">'+fo(I.b)+' of '+S.ov+' overs · run rate '+(I.b?(I.r*6/I.b).toFixed(2):'0.00')+'</div>';

    var t=S.t[I.bat],bo=S.t[1-I.bat].n;
    var h='<div class="card"><b>'+esc(t.n)+' '+I.r+'/'+I.w+'</b> <span class="muted">('+fo(I.b)+' ov)</span><div class="wrap"><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>';
    Object.keys(I.B).forEach(function(n){var b=I.B[n];h+='<tr><td>'+esc(n)+tg(I.bat,n)+'<div class="s">'+esc(b.out||'not out')+'</div></td><td>'+b.r+'</td><td>'+b.b+'</td><td>'+b.f+'</td><td>'+b.s+'</td><td>'+(b.b?(b.r*100/b.b).toFixed(0):'-')+'</td></tr>'});
    h+='</table></div><div class="muted" style="margin:8px 0">Extras: '+I.x+'</div><div class="wrap"><table><tr><th>'+esc(bo)+' bowling</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr>';
    Object.keys(I.O).forEach(function(n){var o=I.O[n];h+='<tr><td>'+esc(n)+tg(1-I.bat,n)+'</td><td>'+fo(o.b)+'</td><td>'+o.r+'</td><td>'+o.w+'</td><td>'+(o.b?(o.r*6/o.b).toFixed(1):'-')+'</td></tr>'});
    return h+'</table></div></div>';
  }).join('');
}
function undoBtn(I){return I.b>0?'<button onclick="undo()">Undo last ball</button>':''}
function sheet(t,x){return '<div class="ov"><div class="sheet"><b>'+t+'</b>'+x+'</div></div>'}
function momList(){var m={};S.i.forEach(function(I){Object.keys(I.B).forEach(function(n){var b=I.B[n],k=I.bat+'|'+n;m[k]=m[k]||{n:n,t:S.t[I.bat].n,r:0,b:0,w:0};m[k].r+=b.r;m[k].b+=b.b});Object.keys(I.O).forEach(function(n){var t=1-I.bat,k=t+'|'+n;m[k]=m[k]||{n:n,t:S.t[t].n,r:0,b:0,w:0};m[k].w+=I.O[n].w});Object.keys(I.F||{}).forEach(function(n){var t=1-I.bat,k=t+'|'+n;m[k]=m[k]||{n:n,t:S.t[t].n,r:0,b:0,w:0};m[k].c=(m[k].c||0)+I.F[n]})});return Object.keys(m).map(function(k){var x=m[k];x.pts=x.r+20*x.w+10*(x.c||0);return x}).sort(function(a,b){return b.pts-a.pts||(a.n<b.n?-1:1)})}
function setM(i){var x=momList()[i];S.mom=x.n+' ('+x.t+')';S.momAsk=false;if(H[0])H[0].mom=S.mom;save();render()}
function modal(){if(RO)return '';
if(S.done){if(!S.momAsk)return '';return sheet('Man of the Match','<div class="muted">Best performer first. Tap to choose.</div>'+momList().map(function(x,i){var d=[];if(x.b||x.r)d.push(x.r+' ('+x.b+')');if(x.w)d.push(x.w+' wkts');if(x.c)d.push(x.c+' fielding');return '<button onclick="setM('+i+')">'+(i===0?'⭐ ':'')+esc(x.n)+' <span class="muted">· '+esc(x.t)+(d.length?' · '+d.join(', '):'')+'</span></button>'}).join('')+'<button onclick="S.momAsk=false;save();render()">Skip</button>')}
var I=cur();
if(!I.st||!I.ns){var p=S.t[I.bat].p,c=Object.keys(I.B).length,t=c===0?'Select the striker (opening batter)':c===1?'Select the non-striker (opening batter)':'Who is the next batter?';return sheet(t,p.map(function(n,i){return I.B.hasOwnProperty(n)?'':'<button onclick="setBat('+i+')">'+esc(n)+tg(I.bat,n)+'</button>'}).join('')+undoBtn(I))}
return modalOld()}
function modalOld(){
  if(S.done)return '';var I=cur();if(I.bw)return '';
  var p=S.t[1-I.bat].p;
  return '<div class="ov"><div class="sheet"><b>Who bowls the next over?</b>'+p.map(function(n,i){return n===I.lb?'':'<button onclick="setB('+i+')">'+esc(n)+tg(1-I.bat,n)+'</button>'}).join('')+undoBtn(I)+'</div></div>';
}
function render(){
  var A=$('#app');
  if(!window.firebase||!auth){A.innerHTML='<div class="sub" style="margin-top:60px;text-align:center">Can\u2019t connect to the server. Check your internet connection and reopen the app.'+(authErr?'<br>'+esc(authErr):'')+'</div>';return}if(!AUTHREADY){A.innerHTML='<div class="sub" style="margin-top:60px;text-align:center">Loading\u2026</div>';return}if(!USER){A.innerHTML=loginV();return}if(!S){A.innerHTML=home();return}if(S.pre){A.innerHTML=roles();return}
  var h='<h1>'+esc(S.t[0].n)+' v '+esc(S.t[1].n)+'</h1><div class="tabs"><button class="'+(tab==='s'?'on':'')+'" onclick="tab=\'s\';render()">Scoring</button><button class="'+(tab==='c'?'on':'')+'" onclick="tab=\'c\';render()">Scorecard</button><button onclick="'+(RO?'unwatch()':'fresh()')+'">'+(RO?'Back':'New match')+'</button></div>'+(RO?'<div class="muted">Following live. View only.</div>':'');
  A.innerHTML=h+(tab==='s'?scoreV():cardV())+modal();
}
load();initFB();render();
</script></body></html>
