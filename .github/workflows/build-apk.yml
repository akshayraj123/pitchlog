name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f google-services.json || { echo "google-services.json is missing from the repository"; exit 1; }
          test -f debug.keystore || { echo "debug.keystore is missing from the repository"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PitchLog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
