name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f google-services.json || { echo "google-services.json is missing from the repository"; exit 1; }
          test -f debug.keystore || { echo "debug.keystore is missing from the repository"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/
      - run: npx cap add android
      - run: cp google-services.json android/app/google-services.json
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - name: Add Google sign-in library
        run: |
          printf '\ndependencies {\n    implementation "com.google.android.gms:play-services-auth:21.2.0"\n}\n' >> android/app/build.gradle
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          tail -5 android/app/build.gradle
          head -4 android/variables.gradle
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PitchLog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launch on virtual phone
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.pitchlog.scorer -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > screen.png
            adb logcat -d -b all > full.txt
            adb logcat -d -b crash > crashbuf.txt
            adb shell dumpsys activity exit-info com.pitchlog.scorer > exitinfo.txt
            adb shell pidof com.pitchlog.scorer > alive.txt || echo DEAD > alive.txt
      - name: Save diagnostics to repository
        if: always()
        continue-on-error: true
        run: |
          mkdir -p diag
          git rm -q --ignore-unmatch diag/crash-log.txt
          cp crashbuf.txt diag/crash-buffer.txt || echo "none" > diag/crash-buffer.txt
          cp exitinfo.txt diag/exit-info.txt || echo "none" > diag/exit-info.txt
          cp alive.txt diag/alive.txt || echo "none" > diag/alive.txt
          cp screen.png diag/screen.png || true
          grep -n -A 60 "FATAL EXCEPTION" full.txt | head -150 > diag/fatal.txt || echo "none" > diag/fatal.txt
          grep -E "pitchlog.scorer|Capacitor|FirebaseAuth|DEBUG|libc" full.txt | grep -v -E "AppsFilter|CarrierSvc|ImsResolver|AiAi|PackageSetting|WindowManager|ActivityTaskManager" | tail -120 > diag/app-log.txt || echo "none" > diag/app-log.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add diag
          git commit -m "diagnostics [skip ci]" || true
          git push || true
